services:
  comfyui:
    build: .
    image: company-ai/comfyui:local
    container_name: comfyui
    gpus: all
    restart: unless-stopped

    ports:
      - "127.0.0.1:8188:8188"

    mem_limit: 60g
    memswap_limit: 60g

    environment:
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True

    volumes:
      - ${COMFY_HOME}/models:/opt/ComfyUI/models:ro
      - ${COMFY_HOME}/input:/opt/ComfyUI/input
      - ${COMFY_HOME}/output:/opt/ComfyUI/output
      - ${COMFY_HOME}/user:/opt/ComfyUI/user

    networks:
      - default
      - studio-engine

networks:
  studio-engine:
    external: true
