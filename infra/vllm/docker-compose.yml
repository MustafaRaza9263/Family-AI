services:
  vllm:
    image: vllm/vllm-openai:v0.20.0
    container_name: vllm
    restart: unless-stopped
    ipc: host
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: ["vllm", "serve"]
    command:
      - Qwen/Qwen3.6-35B-A3B-FP8
      - --served-model-name
      - qwen3.6
      - --api-key
      - ${VLLM_API_KEY}
      - --max-model-len
      - "32768"
      - --gpu-memory-utilization
      - "0.40"
      - --max-num-seqs
      - "8"
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --enable-prefix-caching
    networks:
      - company-ai

# Shared with apps/seven-towers-bot (and Open WebUI). Create once:
#   docker network create company-ai
# Host bind stays 127.0.0.1:8000; other containers reach vllm:8000 on this network.
networks:
  company-ai:
    external: true